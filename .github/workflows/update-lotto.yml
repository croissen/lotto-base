name: 최신 회차 자동 갱신

# 실행 방법 2가지:
#   1) 자동: 매주 토요일 추첨 후 (아래 cron) GitHub가 알아서 실행
#   2) 수동: 저장소 Actions 탭 → 이 워크플로 선택 → "Run workflow" 버튼 클릭
#
# 하는 일: 네이버에서 최신 회차 크롤 → lotto_history에 추가 → combinations 재적재
# 필요 설정(1회): 저장소 Settings → Secrets and variables → Actions →
#                 New repository secret → 이름 SUPABASE_DB_URL, 값은 .env.local의 그 접속문자열

on:
  schedule:
    - cron: '0 13 * * 6'   # 토 22:00 KST (추첨 직후)
    - cron: '0 16 * * 6'   # 일 01:00 KST (백업 — 결과 늦게 올라온 경우)
  workflow_dispatch: {}      # 수동 실행 버튼

concurrency:
  group: update-lotto
  cancel-in-progress: false

permissions:
  contents: write   # keepalive 커밋용

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # GitHub는 60일간 커밋이 없으면 예약 워크플로를 끔 → 마지막 커밋이 30일 넘으면 빈 커밋으로 연장
      - name: 워크플로 비활성화 방지 (keepalive)
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 30 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (자동 갱신 유지)"
            git push
          fi

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install playwright psycopg2-binary python-dotenv numpy
          python -m playwright install --with-deps chromium

      - name: 최신 회차 갱신 (크롤 → 추가 → 재적재)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python tools/update_latest.py
